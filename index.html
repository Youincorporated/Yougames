<style>
  :root {
    --brand-black: #05130a;
    --brand-panel: #0c1f13;
    --brand-green-deep: #123300;
    --brand-green: #1E5A00;
    --brand-green-bright: #3fae00;
    --brand-neon: #7CFF3C;
    --text-dim: #9db89a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; min-height: 100%; background-color: #030a06; }
  body { width: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(circle 520px at 50% 0%, rgba(30,90,0,0.35) 0%, rgba(5,19,10,0) 100%),
      radial-gradient(circle 520px at 100% 100%, rgba(60,175,0,0.12) 0%, rgba(5,19,10,0) 100%),
      linear-gradient(180deg, #060c07 0%, #04100a 45%, #030a06 100%);
    color: #fff;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 18px 90px 18px;
    position: relative;
  }
  .brand-green { color: var(--brand-neon); }
  .bg-green { background-color: var(--brand-green); }
  .box-green {
    background: linear-gradient(180deg, rgba(30,90,0,0.22) 0%, rgba(12,31,19,0.5) 100%);
    border: 1px solid rgba(124,255,60,0.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  h1, h2, h3 { line-height: 1.15; }
  .center { text-align: center; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; }
  .display-font { font-family: 'Bebas Neue', 'Inter', sans-serif; letter-spacing: 1px; }
  .logo-title { font-size: 42px; font-weight: 800; letter-spacing: -1px; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
  .divider {
    height: 1px; width: 100%; margin: 8px 0;
    background: linear-gradient(90deg, rgba(124,255,60,0) 0%, rgba(124,255,60,0.5) 50%, rgba(124,255,60,0) 100%);
  }
  label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.5px; color: #cfe8c9; font-weight: 700; margin-bottom: 8px;
  }
  input[type=text] {
    width: 100%; padding: 15px 16px; border-radius: 12px;
    background: rgba(6, 18, 10, 0.85); border: 1.5px solid rgba(124,255,60,0.4); color: #fff;
    font-size: 17px; font-weight: 600; outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input[type=text]:focus { border-color: var(--brand-neon); box-shadow: 0 0 0 3px rgba(124,255,60,0.15); }
  input[type=text]::placeholder { color: #5c7857; }
  .error-text { color: #f87171; font-size: 12px; margin-top: 6px; }
  .info-text { color: var(--text-dim); font-size: 12px; margin-top: 6px; }
  .btn {
    width: 100%; padding: 17px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--brand-green-bright) 0%, var(--brand-green-deep) 100%);
    color: #fff; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1.5px; font-size: 16px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(30,90,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.97); box-shadow: 0 3px 10px rgba(30,90,0,0.4); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-outline {
    background: rgba(255,255,255,0.03); border: 1.5px solid #2a3a2a; color: #b7cdb3;
    font-weight: 700; border-radius: 12px; padding: 12px; font-size: 13px; cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-outline.active {
    background: linear-gradient(135deg, rgba(63,174,0,0.9), rgba(18,51,0,0.9));
    border-color: var(--brand-neon); color: #fff;
    box-shadow: 0 0 14px rgba(124,255,60,0.35);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0; text-align: center;
    font-size: 11px; color: #5c7857; padding: 12px;
    background: rgba(3, 10, 6, 0.92); border-top: 1px solid rgba(124,255,60,0.15);
    backdrop-filter: blur(6px);
  }
  .timer, .lb-score, .lb-time, .stat-num, .code-display { font-variant-numeric: tabular-nums; }
  .timer {
    font-size: 56px; font-weight: 700; font-family: 'Space Mono', 'Courier New', monospace;
    text-align: center; letter-spacing: 3px;
  }
  .timer-box {
    border: 1.5px solid rgba(124,255,60,0.5); border-radius: 18px; padding: 24px;
    background: rgba(5, 15, 8, 0.7); box-shadow: 0 0 30px rgba(30, 90, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .fill-center {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 28px;
  }
  .progress-track {
    width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px;
    overflow: hidden; margin-bottom: 24px;
  }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--brand-green), var(--brand-neon)); transition: width 0.3s ease; }
  .question-text { font-size: 24px; font-weight: 800; line-height: 1.25; letter-spacing: -0.3px; margin-bottom: 24px; }
  .option {
    width: 100%; text-align: left; padding: 16px; border-radius: 12px;
    border: 1.5px solid rgba(124,255,60,0.25); background: rgba(255,255,255,0.02);
    color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px;
    transition: all 0.15s ease;
  }
  .option:not(:disabled):active { transform: scale(0.98); }
  .option .letter {
    width: 30px; height: 30px; background: linear-gradient(135deg, var(--brand-green-bright), var(--brand-green-deep));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; flex-shrink: 0; font-size: 14px;
  }
  .option.correct { background: rgba(34,197,94,0.25); border-color: #22c55e; }
  .option.incorrect { background: rgba(239,68,68,0.25); border-color: #ef4444; }
  .feedback { text-align: center; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 16px; }
  .feedback.ok { color: var(--brand-neon); }
  .feedback.bad { color: #f87171; }
  .lb-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.02);
    border: 1.5px solid #1c2a1c; margin-bottom: 8px;
  }
  .lb-item.me { background: rgba(30,90,0,0.35); border-color: var(--brand-neon); }
  .lb-item.winner { background: rgba(250,204,21,0.12); border-color: #facc15; }
  .lb-left { display: flex; align-items: center; gap: 12px; }
  .lb-rank { font-weight: 800; font-size: 18px; width: 30px; }
  .lb-name { font-weight: 700; }
  .lb-plat { font-size: 11px; color: var(--text-dim); text-transform: capitalize; }
  .lb-score { font-weight: 700; font-size: 20px; text-align: right; font-family: 'Space Mono', monospace; }
  .lb-time { font-size: 11px; color: var(--text-dim); text-align: right; font-family: 'Space Mono', monospace; }
  .badge {
    display: inline-block; background: rgba(30,90,0,0.25);
    border: 1px solid rgba(124,255,60,0.5); padding: 4px 10px;
    border-radius: 6px; font-size: 12px; margin: 3px; font-weight: 700;
  }
  .code-display {
    font-size: 40px; font-weight: 700; letter-spacing: 6px; text-align: center;
    padding: 20px; background: #fff; color: var(--brand-green); border-radius: 14px;
    font-family: 'Space Mono', monospace;
  }
  .stat-box {
    background: linear-gradient(180deg, rgba(30,90,0,0.2), rgba(12,31,19,0.4));
    border: 1.5px solid rgba(124,255,60,0.4);
    border-radius: 12px; padding: 14px; text-align: center;
  }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--brand-neon); font-family: 'Space Mono', monospace; }
  .stat-label { font-size: 10px; color: #cfe8c9; text-transform: uppercase; letter-spacing: 1px; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid rgba(124,255,60,0.25);
    border-top-color: var(--brand-neon); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- HERO ---- */
  .hero { text-align: center; padding: 6px 0 4px 0; }
  .hero-logo-wrap {
    position: relative;
    width: 210px; margin: 0 auto 14px auto;
  }
  .hero-logo {
    width: 100%; height: auto; display: block;
    filter: drop-shadow(0 0 24px rgba(124,255,60,0.45));
  }
  .hero-logo-shine {
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.85) 50%, transparent 58%);
    background-size: 260% 260%;
    background-position: -160% -160%;
    -webkit-mask-image: url('logo.webp');
    mask-image: url('logo.webp');
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;
    animation: shineSweep 6s ease-in-out var(--sd, 0s) infinite;
  }
  @keyframes shineSweep {
    0%, 55% { background-position: -160% -160%; }
    75% { background-position: 160% 160%; }
    100% { background-position: 160% 160%; }
  }
  .hero-tagline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; letter-spacing: 2px;
    color: var(--brand-neon);
    text-shadow: 0 0 18px rgba(124,255,60,0.5);
    margin-bottom: 4px;
  }
  .hero-desc {
    color: #eafbe3; font-size: 17px; font-weight: 600; line-height: 1.5;
    max-width: 320px; margin: 36px auto 0 auto;
  }
  .form-card {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.15));
    border: 1px solid rgba(124,255,60,0.18);
    border-radius: 18px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  /* ---- BOTÓN PRINCIPAL MÁS GRANDE + DESTELLO ---- */
  .btn-lg { padding: 20px; font-size: 18px; }
  .btn-shine { position: relative; overflow: hidden; }
  .btn-shine::after {
    content: '';
    position: absolute; top: 0; left: -60%; width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent 10%, rgba(255,255,255,0.55) 50%, transparent 90%);
    transform: skewX(-20deg);
    animation: btnShineSweep 6s ease-in-out var(--sd, 0s) infinite;
    pointer-events: none;
  }
  @keyframes btnShineSweep {
    0%, 55% { left: -60%; }
    75% { left: 130%; }
    100% { left: 130%; }
  }

  /* ---- BOTONES MODO (Jugador / Espectador) - mismo nivel de pulido ---- */
  .mode-btn {
    background: linear-gradient(135deg, rgba(124,255,60,0.14), rgba(18,51,0,0.3));
    border: 2px solid rgba(124,255,60,0.4); color: #d7ffc9;
  }
  .mode-btn.active {
    background: linear-gradient(135deg, rgba(63,174,0,0.95), rgba(18,51,0,0.95));
    border-color: #7CFF3C; color: #fff;
    box-shadow: 0 0 16px rgba(124,255,60,0.55);
  }

  /* ---- BOTONES DE PLATAFORMA: color de marca SIEMPRE visible ---- */
  .plat-btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .plat-btn svg { flex-shrink: 0; }
  .plat-twitch {
    background: linear-gradient(135deg, rgba(145,70,255,0.28), rgba(91,31,179,0.2));
    border: 2px solid rgba(145,70,255,0.55); color: #e9dcff;
  }
  .plat-twitch.active {
    background: linear-gradient(135deg, #9146FF, #5b1fb3);
    border-color: #b489ff; color: #fff;
    box-shadow: 0 0 16px rgba(145,70,255,0.6);
  }
  .plat-tiktok {
    background: linear-gradient(135deg, rgba(70,70,70,0.55), rgba(15,15,15,0.6));
    border: 2px solid #000; color: #f2f2f2;
  }
  .plat-tiktok.active {
    background: linear-gradient(135deg, #3a3a3a, #121212);
    border-color: #000; color: #fff;
    box-shadow: 0 0 16px rgba(255,255,255,0.35);
  }
  .plat-youtube {
    background: linear-gradient(135deg, rgba(255,0,0,0.28), rgba(179,0,0,0.2));
    border: 2px solid rgba(255,0,0,0.55); color: #ffdada;
  }
  .plat-youtube.active {
    background: linear-gradient(135deg, #FF0000, #b30000);
    border-color: #ff5c5c; color: #fff;
    box-shadow: 0 0 16px rgba(255,0,0,0.6);
  }

  /* ---- MENÚ SUPERIOR (panel lateral estilo app profesional) ---- */
  .menu-btn {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
    z-index: 50; width: 44px; height: 44px; border-radius: 12px;
    background: rgba(6,18,10,0.9); border: 1.5px solid rgba(124,255,60,0.5);
    color: var(--brand-neon); font-size: 19px; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .menu-backdrop {
    position: fixed; inset: 0; z-index: 55;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(2px);
  }
  .menu-panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60;
    width: min(380px, 88vw); height: 100%;
    background: linear-gradient(180deg, #08170d 0%, #04100a 100%);
    border-left: 1px solid rgba(124,255,60,0.25);
    box-shadow: -12px 0 40px rgba(0,0,0,0.5);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .menu-header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px; padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
    border-bottom: 1px solid rgba(124,255,60,0.18);
    background: rgba(4,16,10,0.96);
  }
  .menu-header-title {
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px;
    font-size: 22px; color: #fff;
  }
  .menu-close-btn {
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(124,255,60,0.3);
    color: #d7ffc9; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-body { padding: 18px; flex: 1; }
  .menu-item {
    width: 100%; display: flex; align-items: center; gap: 14px;
    text-align: left; padding: 14px 12px; border-radius: 14px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(124,255,60,0.14);
    color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer;
    margin-bottom: 10px; transition: background 0.15s ease, border-color 0.15s ease;
  }
  .menu-item:active { background: rgba(124,255,60,0.1); border-color: rgba(124,255,60,0.4); }
  .menu-item-icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(124,255,60,0.22), rgba(18,51,0,0.4));
    border: 1px solid rgba(124,255,60,0.35);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .menu-item-label { flex: 1; }
  .menu-item-chevron { color: var(--text-dim); font-size: 16px; }
  .menu-detail-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
  }
  .menu-detail-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(124,255,60,0.22), rgba(18,51,0,0.4));
    border: 1px solid rgba(124,255,60,0.35);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .menu-detail-title {
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px;
    font-size: 22px; color: var(--brand-neon);
  }
  .menu-back-row {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; color: #b7cdb3;
    font-weight: 600; font-size: 13px; cursor: pointer; margin-bottom: 18px;
    padding: 0;
  }
  .menu-content {
    color: #d7ffc9; font-size: 14px; line-height: 1.75;
  }
  .menu-content p { margin-bottom: 12px; }
  .menu-content p.legal-note {
    font-weight: 700; color: #fff;
    border-left: 3px solid var(--brand-neon);
    padding-left: 12px; margin-top: 16px;
  }
  .menu-rule-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .menu-rule-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(124,255,60,0.12);
    border-radius: 12px; padding: 12px 14px;
  }
  .menu-rule-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--brand-neon);
    margin-top: 6px; flex-shrink: 0; box-shadow: 0 0 8px rgba(124,255,60,0.6);
  }

  /* ---- LAYOUT DE PORTADA: móvil = una columna; escritorio = panel izquierdo | cuadro | panel derecho ---- */
  .home-left { margin-top: 20px; }
  .home-right { margin-top: 12px; }
  .right-stack { display: flex; flex-direction: column; gap: 12px; }
  @media (min-width: 1180px) {
    #app.is-home { max-width: 1240px; padding-bottom: 250px; }
    .home-grid {
      display: grid; grid-template-columns: minmax(0, 1fr) 480px minmax(0, 1fr);
      column-gap: 28px; row-gap: 0; align-items: start;
    }
    .home-main { display: contents; }
    .home-main > .hero { grid-column: 2; grid-row: 1; }
    .home-main > .divider { grid-column: 2; grid-row: 2; }
    .home-main > .form-card { grid-column: 2; grid-row: 3; }
    /* Las columnas laterales miden lo mismo que el cuadro; su contenido flota centrado en ellas */
    .home-left { grid-column: 1; grid-row: 3; align-self: stretch; position: relative; margin-top: 0; }
    .home-left .panel {
      position: absolute; top: 50%; right: 0; transform: translateY(-50%);
      width: 100%; max-width: 300px;
    }
    .home-right { grid-column: 3; grid-row: 3; align-self: stretch; position: relative; margin-top: 0; }
    .right-stack {
      position: absolute; top: 50%; left: 0; transform: translateY(-50%);
      width: 100%; max-width: 300px;
    }
  }

  /* ---- PANEL TOP GLOBAL ---- */
  .panel {
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.18));
    border: 1px solid rgba(124,255,60,0.22); border-radius: 18px; padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .panel-head { margin-bottom: 12px; }
  .panel-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px;
    color: var(--brand-neon); text-shadow: 0 0 14px rgba(124,255,60,0.45);
    white-space: nowrap;
  }
  .panel-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 18px 8px; }
  .tg-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 6px;
    border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(124,255,60,0.1);
  }
  .tg-rank {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px;
    background: rgba(124,255,60,0.12); color: #d7ffc9;
  }
  .tg-row.r1 { border-color: rgba(250,204,21,0.6); background: rgba(250,204,21,0.08); }
  .tg-row.r1 .tg-rank { background: #facc15; color: #1a1400; }
  .tg-row.r2 { border-color: rgba(203,213,225,0.5); }
  .tg-row.r2 .tg-rank { background: #cbd5e1; color: #10141a; }
  .tg-row.r3 { border-color: rgba(205,127,50,0.55); }

    const now = Date.now();
    const startOf = function (g) { return new Date(g.start_time).getTime(); };
    const endOf = function (g) { return startOf(g) + (g.game_duration_seconds || 300) * 1000; };
    const hasWinner = {};
    winners.forEach(function (w) { hasWinner[w.game_id] = true; });
    // Solo cuentan los retos ya terminados que tuvieron al menos un participante
    const finished = games.filter(function (g) { return endOf(g) < now && hasWinner[g.id]; })
      .sort(function (a, b) { return startOf(b) - startOf(a); });
    const upcoming = games.filter(function (g) { return startOf(g) > now; })
      .sort(function (a, b) { return startOf(a) - startOf(b); });
    const live = games.filter(function (g) { return startOf(g) <= now && endOf(g) >= now; })[0] || null;
    const last = finished[0] || null;
    let podium = [];
    if (last) { try { podium = await sbFetchLeaderboard(last.id, 3); } catch (e) { podium = []; } }
    const mine = findMyPodium(last, podium);
    state.right = {
      loaded: true, error: false, hasData: true,
      myPlace: mine.place, myRow: mine.row, myGame: mine.game,
      gamesPlayed: finished.length,
      moneyTotal: finished.reduce(function (acc, g) { return acc + parsePrize(g.prize); }, 0),
      podium: podium, nextGame: upcoming[0] || null, liveGame: live
    };
    if (mine.place) prepareCard();
  } catch (err) {
    state.right.loaded = true;
    state.right.error = true;
  }
  updateRightPanels();
}

// Fecha, hora y zona horaria en la hora local de quien mira la página
function tzInfo(ms) {
  const d = new Date(ms);
  const out = { date: '', time: '', short: '', long: '', iana: '', utc: '' };
  try {
    const date = new Intl.DateTimeFormat('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d);
    out.date = date.charAt(0).toUpperCase() + date.slice(1);
    out.time = new Intl.DateTimeFormat('es', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d);
    new Intl.DateTimeFormat('es', { hour: '2-digit', timeZoneName: 'short' }).formatToParts(d)
      .forEach(function (x) { if (x.type === 'timeZoneName') out.short = x.value; });
    new Intl.DateTimeFormat('es', { hour: '2-digit', timeZoneName: 'long' }).formatToParts(d)
      .forEach(function (x) { if (x.type === 'timeZoneName') out.long = x.value; });
    out.iana = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    const utcTime = new Intl.DateTimeFormat('es', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'UTC' }).format(d);
    const dayLocal = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    const dayUtc = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'UTC' }).format(d);
    if (dayLocal !== dayUtc || utcTime !== out.time) {
      out.utc = utcTime + ' UTC' + (dayLocal !== dayUtc
        ? ' (' + new Intl.DateTimeFormat('es', { day: 'numeric', month: 'short', timeZone: 'UTC' }).format(d) + ')' : '');
    }
  } catch (e) {
    out.date = d.toLocaleString();
  }
  return out;
}

// ¿Está esta persona en el podio del último reto ya terminado? Solo entonces puede compartirlo.
function findMyPodium(last, podium) {
  const none = { place: 0, row: null, game: '' };
  if (!last || !podium.length) return none;
  const endMs = new Date(last.start_time).getTime() + (last.game_duration_seconds || 300) * 1000;
  if (Date.now() < endMs + 30000) return none;           // esperar a que el resultado sea definitivo
  const plays = loadPlays();
  for (let i = 0; i < Math.min(3, podium.length); i++) {
    if (plays.some(function (pl) { return pl.game === last.id && pl.user === podium[i].username; })) {
      return { place: i + 1, row: podium[i], game: last.id };
    }
  }
  return none;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fitText(ctx, text, maxW, startPx, family, weight) {
  let px = startPx;
  while (px > 24) {
    ctx.font = (weight ? weight + ' ' : '') + px + 'px ' + family;
    if (ctx.measureText(text).width <= maxW) break;
    px -= 4;
  }
  return px;
}
function loadImage(src) {
  return new Promise(function (resolve, reject) {
    const im = new Image();
    im.onload = function () { resolve(im); };
    im.onerror = reject;
    im.src = src;
  });
}

  roundRectPath(ctx, x0, y0, pw, ph, 48); ctx.fillStyle = 'rgba(30,90,0,0.45)'; ctx.fill();
  ctx.strokeStyle = 'rgba(124,255,60,0.8)'; ctx.lineWidth = 3; ctx.stroke();

async function sharePodium() {
  const r = state.right;
  if (!r.myPlace || !r.myRow) return;
  const copy = PODIUM_COPY[r.myPlace];
  const link = location.href.split('#')[0].split('?')[0];
  if (podiumCard.key !== podiumKey() || !podiumCard.file) await prepareCard();
  const file = podiumCard.key === podiumKey() ? podiumCard.file : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'YOU GAMES', text: copy.caption + '\n¡Entra y juega! ' + link });
      return;
    } catch (err) { if (err && err.name === 'AbortError') return; }
  }
  if (navigator.share) {
    try { await navigator.share({ title: 'YOU GAMES', text: copy.caption, url: link }); return; }
    catch (err) { if (err && err.name === 'AbortError') return; }
  }
  // Escritorio: se descarga la imagen y se copia el texto
  if (file) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  let copied = false;
  try { await navigator.clipboard.writeText(copy.caption + '\n¡Entra y juega! ' + link); copied = true; } catch (e) {}
  podiumFeedback(file ? (copied ? '¡Imagen descargada y texto copiado!' : '¡Imagen descargada!') : (copied ? '¡Texto copiado!' : 'No se pudo compartir'));

async function startGame() {
  const errors = {};
  const code = state.gameCodeInput.trim().toUpperCase();
  if (!code) errors.gameCode = 'Ingresa el código del reto';
  if (state.mode === 'spectator' && !state.usernameInput.trim()) errors.username = 'Ingresa tu nombre';
  const chosenPlatforms = Object.keys(state.platformSelected).filter(function (k) { return state.platformSelected[k]; });
  if (state.mode === 'spectator' && chosenPlatforms.length === 0) errors.platform = 'Selecciona al menos una plataforma';

  if (Object.keys(errors).length > 0) {
    state.errors = errors;
    render();
    return;
  }

  state.errors = {};
  state.loading = true;
  state.loadError = '';
  render();

  try {
    const game = await sbFetchGame(code);
    if (!game) {
      state.loading = false;
      state.errors = { gameCode: 'Ese código no existe. Verifica con el streamer.' };
      render();
      return;
    }
    const questions = await sbFetchQuestions(code);

    state.gameCode = code;
    state.currentGame = game;
    state.questions = questions;

    if (state.mode === 'streamer') {
      state.loading = false;
      state.screen = 'streamer';
      state.streamerCount = null;
      render();
      startStreamerPolling();
      return;
    }

    const gameStartMs = new Date(game.start_time).getTime();
    const gameEndMs = gameStartMs + (game.game_duration_seconds || 300) * 1000;
    if (Date.now() > gameEndMs) {
      state.loading = false;
      state.errors = { gameCode: 'Este reto ya cerró 🤦🏼‍♂️ Está atento al próximo juego 😁' };
      render();
      return;
    }

    const username = state.usernameInput.trim();
    const alreadyPlayed = await sbCheckAlreadyPlayed(code, username);
    if (alreadyPlayed) {
      state.loading = false;
      state.errors = { username: 'Este usuario ya participó en este reto, usa el mismo usuario con el que sigues a YOU Inc.' };
      render();
      return;
    }

    state.loading = false;
    state.username = username;
    state.platform = chosenPlatforms.join(', ');
    state.screen = 'waiting';
    state.countdownEndTime = new Date(game.start_time).getTime();
    render();
    startCountdown();
  } catch (err) {
    state.loading = false;
    state.loadError = 'No se pudo conectar. Revisa tu internet e intenta de nuevo.';
    render();
  }
}

function startCountdown() {
  timers.countdown = setInterval(() => {
    const remaining = Math.round((state.countdownEndTime - Date.now()) / 1000);
    const el = document.getElementById('countdown-timer');
    if (el) el.textContent = fmtTime(remaining);
    if (remaining <= 0) {
      clearInterval(timers.countdown);
      timers.countdown = null;
      startQuiz();
    }
  }, 200);
}

function startQuiz() {
  state.screen = 'quiz';
  state.questionIndex = 0;
  state.userAnswers = [];
  state.selectedAnswer = null;
  state.showFeedback = false;
  state.quizStartedAt = Date.now();
  // Nadie puede seguir jugando después del cierre del reto: así el podio es definitivo
  const durMs = (state.currentGame.game_duration_seconds || 300) * 1000;
  const closeMs = new Date(state.currentGame.start_time).getTime() + durMs;
  state.quizEndTime = Math.min(Date.now() + durMs, closeMs);
  render();
  timers.quiz = setInterval(() => {
    const remaining = Math.round((state.quizEndTime - Date.now()) / 1000);
    const el = document.getElementById('quiz-timer');
    if (el) el.textContent = fmtTime(remaining);
    if (remaining <= 0) {
      clearInterval(timers.quiz);
      timers.quiz = null;
      finishQuiz();
    }
  }, 500);
}

function answerQuestion(index) {
  if (state.showFeedback) return;
  state.selectedAnswer = index;
  state.showFeedback = true;
  render();

  setTimeout(function () {
    state.userAnswers.push(index);
    state.selectedAnswer = null;
    state.showFeedback = false;

    if (state.questionIndex < state.questions.length - 1) {
      state.questionIndex++;
      render();
    } else {
      finishQuiz();
    }
  }, 700);
}

async function finishQuiz() {
  if (timers.quiz) { clearInterval(timers.quiz); timers.quiz = null; }
  const correctCount = state.userAnswers.filter(function (a, i) { return a === state.questions[i].correct_index; }).length;
  const timeTakenMs = Date.now() - state.quizStartedAt;

  state.screen = 'saving';
  render();

  try {
    await sbInsertParticipation({
      game_id: state.gameCode,
      username: state.username,
      platform: state.platform,
      correct_answers: correctCount,
      time_taken_ms: timeTakenMs,
    });
    rememberPlay(state.gameCode, state.username);
    const lb = await sbFetchLeaderboard(state.gameCode, 10);
    state.leaderboard = lb;
    state.loadError = '';
    try {
      const winsRows = await sbFetchPlayerWins();
      state.winsMap = buildWinsMap(winsRows);
    } catch (e2) {
      // Si falla, simplemente no se muestran coronas esta vez
    }
  } catch (err) {
    state.loadError = 'Se guardó tu resultado, pero no pudimos cargar el ranking completo.';
    state.leaderboard = [{ username: state.username, platform: state.platform, correct_answers: correctCount, time_taken_ms: timeTakenMs }];
  }

  state.myResult = { correct: correctCount, timeMs: timeTakenMs };
  state.screen = 'results';
  render();
}

function startStreamerPolling() {
  refreshStreamerData();
  timers.poll = setInterval(refreshStreamerData, 4000);
}

// Cuántas personas han terminado este reto. Pide solo el total (HEAD), sin descargar a nadie.
async function sbCountParticipants(gameId) {
  const base = SUPABASE_URL + '/rest/v1/participations?game_id=eq.' + encodeURIComponent(gameId) + '&select=id';
  const res = await fetch(base, { method: 'HEAD', headers: Object.assign({}, sbHeaders, { 'Prefer': 'count=exact' }) });
  if (!res.ok) throw new Error('Error contando participantes');
  const range = res.headers.get('content-range');          // "*/37" o "0-9/37"
  const m = range && range.match(/\/(\d+)$/);
  if (m) return parseInt(m[1], 10);
  // Respaldo por si el servidor no expone ese encabezado: contar las filas
  const res2 = await fetch(base, { headers: sbHeaders });
  if (!res2.ok) throw new Error('Error contando participantes');
  return (await res2.json()).length;
}

function fmtCount(n) { return (typeof n === 'number') ? n.toLocaleString('en-US') : '—'; }

function updateParticipantCount(n) {
  const prev = state.streamerCount;
  state.streamerCount = n;
  const el = document.getElementById('streamer-count');
  if (!el) return;
  el.textContent = fmtCount(n);
  if (typeof prev === 'number' && n > prev) {          // destello breve cuando llega gente nueva
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
}

async function refreshStreamerData() {
  const code = state.gameCode;
  const results = await Promise.all([
    sbFetchLeaderboard(code, 10).catch(function () { return null; }),
    sbCountParticipants(code).catch(function () { return null; })
  ]);
  if (state.screen !== 'streamer' || state.gameCode !== code) return;   // ya salió de esta pantalla
  if (results[1] !== null) updateParticipantCount(results[1]);
  if (results[0] !== null) {
    state.leaderboard = results[0];
    try {
      const winsRows = await sbFetchPlayerWins();
      state.winsMap = buildWinsMap(winsRows);
    } catch (e2) {
      // silencioso
    }
    const el = document.getElementById('streamer-live-area');
    if (el) el.innerHTML = streamerLiveHtml();
  }
}

// Texto que se comparte. "Voy #N" (y no "Quedé") porque el reto puede seguir abierto y el puesto aún puede cambiar.
function shareTextFor() {
  const me = state.myResult;
  if (!me) return '';
  let rank = -1;
  state.leaderboard.forEach(function (p, i) { if (rank < 0 && p.username === state.username) rank = i + 1; });
  const score = me.correct + '/' + state.questions.length + ' ✅ en ' + fmtMs(me.timeMs);
  return rank > 0
    ? 'Voy #' + rank + ' en YOU GAMES 🏆 con ' + score + '. ¿Puedes superarme?'
    : 'En YOU GAMES hice ' + score + '. ¿Puedes superarme?';
}

async function shareResult() {
  const text = shareTextFor();
  if (!text) return;
  const url = location.href.split('#')[0].split('?')[0];
  if (navigator.share) {
    try {
      await navigator.share({ title: 'YOU GAMES', text: text, url: url });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return; // la persona cerró el menú de compartir: no hacemos nada más
    }
  }
  const full = text + ' ' + url;
  let copied = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(full);
      copied = true;
    }
  } catch (e) {}
  if (!copied) { window.prompt('Copia tu resultado y compártelo:', full); return; }
  const label = document.getElementById('share-label');
  if (label) {
    label.textContent = '¡Copiado!';
    setTimeout(function () {
      const l = document.getElementById('share-label');
      if (l) l.textContent = 'Compartir mi resultado';
    }, 2000);
  }
}

function attachHandlers() {
  const app = document.getElementById('app');

  const codeInput = document.getElementById('input-code');
  if (codeInput) {
    codeInput.addEventListener('input', function (e) {
      state.gameCodeInput = e.target.value.toUpperCase();
      e.target.value = state.gameCodeInput;
    });
  }
  const userInput = document.getElementById('input-username');
  if (userInput) {
    userInput.addEventListener('input', function (e) {
      state.usernameInput = e.target.value;
    });
  }

  app.querySelectorAll('[data-action]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const action = btn.getAttribute('data-action');
      if (action === 'set-mode') {
        state.mode = btn.getAttribute('data-mode');
        render();
      } else if (action === 'toggle-platform') {
        const p = btn.getAttribute('data-platform');
        state.platformSelected[p] = !state.platformSelected[p];
        render();
      } else if (action === 'play') {
        startGame();
      } else if (action === 'answer') {
        answerQuestion(parseInt(btn.getAttribute('data-index'), 10));
      } else if (action === 'logo') {
        logoAction();
      } else if (action === 'share') {
        shareResult();
      } else if (action === 'home') {
        goHome();
      } else if (action === 'menu-toggle') {
        state.menuOpen = !state.menuOpen;
        state.menuSection = null;
        render();
      } else if (action === 'menu-close') {
        state.menuOpen = false;
        state.menuSection = null;
        render();
      } else if (action === 'menu-section') {
        state.menuSection = btn.getAttribute('data-section');
        render();
      } else if (action === 'menu-back') {
        state.menuSection = null;
        render();
      }
    });
  });
}
